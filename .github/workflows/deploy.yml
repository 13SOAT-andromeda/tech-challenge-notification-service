name: Build and Deploy Lambda

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: AWS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names tech-challenge-notification-service-repo \
            || aws ecr create-repository --repository-name tech-challenge-notification-service-repo

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: tech-challenge-notification-service-repo
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy-infra:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: AWS
    defaults:
      run:
        working-directory: terraform
    env:
      TF_INPUT: "false"
      TF_VAR_image_tag: ${{ github.sha }}
      TF_VAR_sqs_queue_name: notification-events-queue-prod
      TF_VAR_mailtrap_token: ${{ secrets.MAILTRAP_TOKEN }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_s3_bucket_name: ${{ secrets.S3_BUCKET_NAME }}
      TF_VAR_mailtrap_url: ${{ secrets.MAILTRAP_URL }}
      TF_VAR_mailtrap_from_email: ${{ secrets.MAILTRAP_FROM_EMAIL }}
      TF_VAR_mailtrap_from_name: ${{ secrets.MAILTRAP_FROM_NAME }}
      TF_VAR_internal_auth_token: ${{ secrets.INTERNAL_AUTH_TOKEN }}
      TF_VAR_admin_email: ${{ secrets.USER_ADMIN_EMAIL }}
      TF_VAR_admin_document: ${{ secrets.ADMIN_DOCUMENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.AWS_S3_TF_STATE_BUCKET_NAME }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Import pre-existing ECR repo (if not already in state)
        run: |
          terraform state show aws_ecr_repository.this >/dev/null 2>&1 \
            || terraform import aws_ecr_repository.this tech-challenge-notification-service-repo

      - name: Terraform Apply
        run: terraform apply -auto-approve
