<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Falha no processamento do vídeo</title></head>
<body style="font-family:Arial,sans-serif;background:#f4f4f4;padding:20px">
  <div style="max-width:600px;margin:0 auto;background:#fff;border-radius:8px;padding:32px">
    <h2 style="color:#b23b3b">⚠️ Falha no processamento do vídeo</h2>
    <p>Olá, <strong>$name</strong>!</p>
    <p>Não foi possível concluir o processamento do vídeo enviado abaixo.</p>
    <table style="width:100%;border-collapse:collapse;margin:20px 0">
      <tr style="background:#f0f0f0">
        <td style="padding:10px;font-weight:bold">Arquivo</td>
        <td style="padding:10px">$fileName</td>
      </tr>
      <tr>
        <td style="padding:10px;font-weight:bold">Link ID</td>
        <td style="padding:10px">$linkId</td>
      </tr>
      <tr style="background:#f0f0f0">
        <td style="padding:10px;font-weight:bold">Motivo</td>
        <td style="padding:10px">$reason</td>
      </tr>
    </table>
    <p style="color:#666;font-size:14px">Verifique se o arquivo enviado atende aos requisitos suportados e tente novamente.</p>
  </div>
</body>
</html>
